spring:
    # note: sqltoy properties live under the spring.sqltoy prefix
    sqltoy:
        sqlResourcesDir: classpath:com/sqltoy/showcase
        # staffIdName cache, used by the <cache-arg> reverse-match demo
        translateConfig: classpath:sqltoy-translate.xml
        debug: true
        # audit-field auto-fill + the authedOrganIds data-auth filter (see TenantAuthTest)
        unifyFieldsHandler: com.sqltoy.showcase.plugins.ShowcaseUnifyFieldsHandler
        # custom TypeHandler: maps the Money value object onto varchar (see CustomTypeHandlerTest)
        typeHandler: com.sqltoy.showcase.plugins.MoneyTypeHandler
        # the JSON library is auto-detected from the classpath (fastjson2 -> jackson3 -> jackson2).
        # this project ships jackson-databind only, so the JSON-column and ES demos run on jackson2
        # with no configuration at all. Only pin it to override the detection — built-in aliases
        # are fastjson2 / jackson3 / jackson2, a custom implementation takes its full class name:
        #jsonProvider: jackson2
        printSqlTimeoutMillis: 300000
        # RSA key pair for the field-encryption demos (see SecureEncryptTest)
        securePrivateKey: classpath:mock/rsa_private.key
        securePublicKey: classpath:mock/rsa_public.key
    datasource:
       # two named in-memory H2 databases; a random suffix per context keeps test contexts isolated
       ds0:
          url: jdbc:h2:mem:showcase0-${random.uuid};DB_CLOSE_DELAY=-1
       ds1:
          url: jdbc:h2:mem:showcase1-${random.uuid};DB_CLOSE_DELAY=-1
